{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto py-16">
  <h1 class="text-lg font-serif text-slate-900 mb-8">Sign in</h1>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <p class="text-sm mb-4 {% if category == 'error' %}text-rose-700{% else %}text-slate-500{% endif %}">
        {{ msg }}
      </p>
    {% endfor %}
  {% endwith %}

  <form method="post" class="space-y-6">
    {{ csrf_token() }}
    <div>
      <label class="block text-xs uppercase tracking-wide text-slate-500 mb-1">Email</label>
      <input type="email" name="email" autocomplete="email" required
             class="w-full border-b border-slate-300 py-1 text-sm bg-transparent focus:outline-none focus:border-slate-900">
    </div>
    <div>
      <label class="block text-xs uppercase tracking-wide text-slate-500 mb-1">Password</label>
      <input type="password" name="password" autocomplete="current-password" required
             class="w-full border-b border-slate-300 py-1 text-sm bg-transparent focus:outline-none focus:border-slate-900">
    </div>
    <button type="submit"
            class="text-sm text-slate-900 border-b border-slate-400 hover:border-slate-900 pb-0.5">
      Sign in
    </button>
  </form>
</div>
{% endblock %}
